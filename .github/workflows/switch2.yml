name: toronja-switch2

# Builds the Switch 2 port (ounce-devkit / OunceVK) in CI so no local devkitPro
# install is needed. The build log in the PR is the feedback loop for finishing
# the port; the NRO is uploaded as an artifact once it compiles.
# Only pushes to the port branch build (the pull_request trigger doubled every
# build), and a newer push cancels the build of the one before it.
on:
  push:
    branches: [main, switch2-gameshare]
    # Docs-only pushes do not build (and so do not cancel a build in progress).
    paths-ignore: ['**.md', 'tools/gameshare/**', 'tools/ui-preview/**', 'tools/branding/**', 'tools/covers/**',
                   '.github/workflows/gameshare-receiver.yml', '.github/workflows/ui-preview.yml',
                   '.github/workflows/switch1.yml', 'docker/switch1/**']
  # Manual run. Give it a release tag to also publish the build as a GitHub
  # release: that is what the in-app updater (Check for Updates) installs.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish as release with this tag (must be v + DEKOPON_VERSION, e.g. v0.9.0). Empty = build only.'
        required: false
        default: ''
      prerelease:
        description: 'Mark the release as a prerelease (Prerelease update channel only)'
        type: boolean
        default: false
      notes:
        description: 'Release notes (shown in the app under Release Notes)'
        required: false
        default: ''

concurrency:
  group: toronja-switch2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write: only used by the manual release step.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore the toolchain image
        id: toolchain
        uses: actions/cache/restore@v4
        with:
          path: /tmp/toolchain-image.tar
          key: toolchain-image-${{ hashFiles('docker/switch2/Dockerfile') }}

      - name: Build the Switch 2 toolchain image
        run: |
          # The image is kept in the Actions cache: pkg.devkitpro.org refuses GitHub's
          # runners (403) often enough that building it on every run is not workable.
          if [ -f /tmp/toolchain-image.tar ]; then
            docker load -i /tmp/toolchain-image.tar && exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            if docker build -t dekopon-switch2 -f docker/switch2/Dockerfile .; then
              docker save dekopon-switch2 -o /tmp/toolchain-image.tar
              exit 0
            fi
            echo "toolchain image build failed (attempt $attempt), retrying in 60 s"
            sleep 60
          done
          exit 1

      - name: Keep the toolchain image for later runs
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/toolchain-image.tar
          key: toolchain-image-${{ hashFiles('docker/switch2/Dockerfile') }}

      # Compiler cache (docker/switch2/build.sh points ccache at .ccache in the
      # workspace). Compiling is ~20 of the ~23 minutes of a cold build.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: switch2-ccache-${{ github.sha }}
          restore-keys: |
            switch2-ccache-

      - name: Build toronja.nro
        run: docker run --rm -v "${{ github.workspace }}:/src" dekopon-switch2 docker/switch2/build.sh

      # Saved even when the build fails, so the next attempt reuses what compiled.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: switch2-ccache-${{ github.sha }}

      - name: Upload NRO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: toronja-switch2-nro
          path: build/switch/src/citra_switch/toronja.nro
          if-no-files-found: error

      # The updater looks for a release asset named exactly toronja-switch2.nro (a Switch 1
      # looks for toronja-switch1.nro) and checks the sha256 digest GitHub records for it.
      - name: Publish release
        if: success() && github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(sed -n 's/.*set(DEKOPON_VERSION "\(.*\)").*/\1/p' CMakeLists.txt | head -n1)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::release_tag '$TAG' does not match the built version 'v$version' (DEKOPON_VERSION in CMakeLists.txt)"
            exit 1
          fi
          [ -n "$NOTES" ] || NOTES="Toronja $TAG"
          flags=()
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
          cp build/switch/src/citra_switch/toronja.nro toronja-switch2.nro
          gh release create "$TAG" toronja-switch2.nro \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Toronja $TAG" --notes "$NOTES" "${flags[@]}"

      # Collect the unstripped ELF wherever CMake/nx_create_nro left it, so a
      # crash.txt pc/lr offset can be resolved with aarch64-none-elf-addr2line.
      - name: Collect debug ELF
        if: always()
        run: |
          mkdir -p debug
          echo "== elf/map candidates in build tree =="
          find build -type f \( -name '*.elf' -o -name '*.map' \) -print || true
          find build -type f -name '*.elf' -exec cp -v {} debug/ \; || true
          find build -type f -name '*.map' -exec cp -v {} debug/ \; || true
          # Fallback: the citra_switch executable may have no .elf suffix.
          find build -type f -name 'citra_switch' -exec cp -v {} debug/citra_switch.elf \; || true
          echo "== collected =="
          ls -la debug || true

      - name: Upload debug ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toronja-switch2-debug
          path: debug/
          if-no-files-found: warn
