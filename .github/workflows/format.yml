name: citra-format

on:
  push:
    branches: [ "*", "!switch2-ounce-devkit" ]
  pull_request:
    branches: [ master ]

jobs:
  clang-format:
    if: ${{ github.head_ref != 'switch2-ounce-devkit' }}
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: ./.ci/clang-format.sh

  ktlint:
    if: ${{ github.head_ref != 'switch2-ounce-devkit' }}
    runs-on: ubuntu-latest
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build
        run: ./tools/check-kotlin-formatting.sh