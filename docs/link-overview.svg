<text x="440" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle">One second console at a time  ·  same player, not a second player  ·  local only, not over the internet</text>
