<text x="440" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6d625b" text-anchor="middle">Console to console. Nothing else is needed, and neither console needs the internet.</text>
<text x="440" y="372" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2a2420" text-anchor="middle">While linked, the main console leaves its usual Wi-Fi  ·  the second console must be a Switch 1 opened from the Album</text>
